function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function setupPanes(map) {
  map.createPane('mask').style.zIndex = 330;
  map.createPane('raions').style.zIndex = 350;
}
function makeMask(geo) {
  var rings = [[[-90, -180], [-90, 180], [90, 180], [90, -180]]];
  var polys = geo.type === 'Polygon' ? [geo.coordinates] : geo.coordinates;
  polys.forEach(function (p) { p.forEach(function (r) { rings.push(r.map(function (c) { return [c[1], c[0]]; })); }); });
  return L.polygon(rings, { pane: 'mask', stroke: false, fillColor: '#1f2a33', fillOpacity: 0.72, interactive: false });
}
function makeShape(s) {
  var o = { color: s.color || '#e11d48', weight: 3, fillOpacity: 0.25 };
  var l;
  if (s.t === 'm') l = L.marker(s.ll);
  else if (s.t === 'c') l = L.circle(s.ll, { color: o.color, weight: 3, fillOpacity: 0.25, radius: s.r });
  else if (s.t === 'p') l = L.polygon(s.ll, o);
  else l = L.polyline(s.ll, o);
  if (s.label) l.bindTooltip(esc(s.label), { permanent: true, direction: s.t === 'm' ? 'top' : 'center', className: 'lbl' });
  l._d = { t: s.t, label: s.label || '' };
  return l;
}
function addLegend(map, raions) {
  var c = L.control({ position: 'bottomleft' });
  c.onAdd = function () { this._d = L.DomUtil.create('div', 'legend'); return this._d; };
  c.update = function (rs) {
    this._d.style.display = rs.length ? '' : 'none';
    this._d.innerHTML = '<b>Райони</b>' + rs.map(function (r) {
      return '<div><i style="background:' + r.color + '"></i>' + esc(r.tip) + '</div>';
    }).join('');
  };
  c.addTo(map); c.update(raions);
  return c;
}
function viewerMain(D) {
  var map = L.map('map').setView(D.view.c, D.view.z);
  setupPanes(map);
  L.tileLayer(D.base.u, D.base.o).addTo(map);
  makeMask(D.land).addTo(map);
  L.geoJSON(D.land, { style: { color: '#c0392b', weight: 3, fill: false }, interactive: false }).addTo(map);
  (D.raions || []).forEach(function (r) {
    var l = L.geoJSON(r.geo, { pane: 'raions', style: {
      color: '#1e293b', weight: 1.5, fillColor: r.color || '#ffffff', fillOpacity: r.color ? 0.38 : 0.01 } }).addTo(map);
    l.bindTooltip(r.tip, { sticky: true, className: 'rn' });
  });
  (D.shapes || []).forEach(function (s) { makeShape(s).addTo(map); });
  addLegend(map, D.raions || []);
}
viewerMain(D);
